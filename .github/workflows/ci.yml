name: Build and verify

on:
  push:
    branches: [main, feat/streaming-renderer]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real Worker and WebGL in a browser
        run: |
          npm start > /tmp/flowscape-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173/ > /dev/null
          npm run test:browser
